
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fitness Booking</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:35px;
    font-family:'Manrope',sans-serif;

    background:
    radial-gradient(circle at top right,#e7dcd244,transparent 30%),
    radial-gradient(circle at bottom left,#d4b8a333,transparent 30%),
    #f8f5f1;

    color:#1e1e1e;
}

.hero{
    text-align:center;
    margin-bottom:50px;
}

.hero h1{
    font-size:56px;
    font-weight:800;
    margin:0;
}

.hero p{
    margin-top:16px;
    color:#6b7280;
    font-size:18px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:20px;
    margin-bottom:40px;
}

.stat{
    background:white;
    border-radius:28px;
    padding:24px;
    box-shadow:0 10px 40px rgba(0,0,0,0.05);
}

.stat-title{
    color:#94a3b8;
    margin-bottom:10px;
    font-size:14px;
}

.stat-value{
    font-size:34px;
    font-weight:800;
}

.cards{
    display:grid;
    gap:24px;
}

.card{
    background:white;
    border-radius:32px;
    padding:30px;

    box-shadow:
    0 10px 40px rgba(0,0,0,0.06);

    transition:0.25s;
}

.card:hover{
    transform:translateY(-4px);
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.title{
    font-size:28px;
    font-weight:800;
}

.badge{
    background:#f5e6dc;
    color:#9a6b4f;

    padding:10px 18px;
    border-radius:999px;

    font-size:13px;
    font-weight:700;
}

.time{
    font-size:22px;
    font-weight:700;
    margin-bottom:12px;
}

.username{
    color:#64748b;
    margin-bottom:16px;
}

.footer{
    margin-top:45px;
    text-align:center;
    color:#94a3b8;
}

</style>
</head>

<body>

<div class="hero">
    <h1>✨ Запис на тренування</h1>

    <p>
        Wellness • Fitness • Stretching
    </p>
</div>

<div class="stats">

<div class="stat">
<div class="stat-title">АКТИВНІ ЗАПИСИ</div>
<div class="stat-value">{{ bookings|length }}</div>
</div>

<div class="stat">
<div class="stat-title">СТАТУС</div>
<div class="stat-value">ONLINE</div>
</div>

<div class="stat">
<div class="stat-title">MINI APP</div>
<div class="stat-value">ACTIVE</div>
</div>

</div>

<div class="cards">

{% for booking in bookings %}

<div class="card">

<div class="top">

<div class="title">
🤍 Тренування
</div>

<div class="badge">
ПІДТВЕРДЖЕНО
</div>

</div>

<div class="time">
📅 {{ booking[0] }} • ⏰ {{ booking[1] }}
</div>

<div class="username">
@{{ booking[3] }}
</div>

</div>

{% endfor %}

</div>

<div class="footer">
Premium Fitness Booking System
</div>

</body>
</html>
